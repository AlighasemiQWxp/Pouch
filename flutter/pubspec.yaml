name: pouch
description: "Pouch offline budget planner"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  intl: ^0.20.3
  pouch_core:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pouch-icon.png
    - assets/l10n/strings_en.json
    - assets/l10n/strings_fa.json
